<!doctype html>
<html lang="en">

    <title>Ability GIF previews · OpenMMO</title>
    <style>
      * { box-sizing: border-box }

      h1 { margin: 0 0 4px; font-size: 28px; font-weight: 550 }

      figure { margin: 0; border: 1px solid #34414b; background: #131e25; border-radius: 10px; overflow: hidden }
      img { width: 100%; height: auto; display: block }
      figcaption { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; gap: 12px }
      a { color: #cfdfec; text-underline-offset: 4px }
      span { color: #9fafb8; font-size: 13px }
      footer { margin-top: 22px; color: #9fafb8; font-size: 13px }
      @media(max-width: 760px) { body { padding: 16px } section { grid-template-columns: 1fr } }
