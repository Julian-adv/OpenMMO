<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>캐릭터 파츠 · 동작 미리보기</title>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">OPENMMO · CHARACTER WORKSHOP</p>
        <h1>캐릭터 파츠 미리보기</h1>
        <p>
          헤어와 복장을 바꾸고, 동작을 이어 재생하면서 착용 모습을 살펴보세요.
        </p>
      </header>
      <div class="workspace">
        <section id="viewport" aria-label="캐릭터 3D 미리보기">
          <p class="hint">드래그하여 회전 · 휠로 확대</p>
        </section>
        <aside>
          <p id="status" role="status">몸체와 교체 파츠를 불러오는 중…</p>
          <fieldset id="controls" disabled>
            <legend>외형과 동작</legend>
            <label for="hair">헤어</label>
            <select id="hair">
              <option value="hair_crop">짧은 크롭</option>
              <option value="hair_sidepart">짧은 옆가르마</option>
              <option value="none">없음</option>
            </select>
            <label for="hair-color">머리색</label>
            <input id="hair-color" type="color" value="#604332" />
            <label for="eye-color">눈색</label>
            <input id="eye-color" type="color" value="#786545" />
            <label for="top">상의</label>
            <select id="top">
              <option value="linen">기본 천 셔츠</option>
              <option value="leather">가죽 갑옷</option>
              <option value="plate" selected>판금 갑옷</option>
              <option value="none">착용 전 몸체</option>
            </select>
            <label for="pants">하의</label>
            <select id="pants">
              <option value="cloth">천 바지</option>
              <option value="plate" selected>판금 바지</option>
            </select>
            <label for="gloves">장갑</label>
            <select id="gloves">
              <option value="none">없음</option>
              <option value="leather">가죽 장갑</option>
              <option value="plate" selected>판금 장갑</option>
            </select>
            <label for="boots">신발</label>
            <select id="boots">
              <option value="none">없음</option>
              <option value="leather">가죽 부츠</option>
              <option value="plate" selected>판금 신발</option>
            </select>
            <label for="helmet">헬멧</label>
            <select id="helmet">
              <option value="none">없음</option>
              <option value="plate" selected>판금 헬멧</option>
            </select>
            <button id="knight-outfit" type="button">
              기사 판금 세트 입기
            </button>
            <label for="clip">동작</label>
            <select id="clip">
              <option value="idle1">대기</option>
              <option value="walk">걷기</option>
              <option value="run">달리기</option>
              <option value="jump">점프</option>
              <option value="combat_idle" selected>전투 대기</option>
              <option value="slash1">공격</option>
              <option value="dying">쓰러지기</option>
            </select>
            <div class="buttons">
              <button id="pause" type="button">일시정지</button>
              <button id="replay" type="button">처음부터</button>
            </div>
            <label for="scrub"
              >재생 위치 <output id="time">0.00 / 0.00초</output></label
            >
            <input
              id="scrub"
              type="range"
              min="0"
              max="1"
              step="0.001"
              value="0"
            />
            <label for="speed">재생 속도</label>
            <select id="speed">
              <option value="0.25">0.25배</option>
              <option value="0.5">0.5배</option>
              <option value="1" selected>1배</option>
            </select>
            <label for="camera">시점</label>
            <select id="camera">
              <option value="full">전신</option>
              <option value="face">얼굴 확대</option>
              <option value="hand">오른손 확대</option>
            </select>
            <label class="toggle"
              ><input id="weapon" type="checkbox" checked /> 검 표시</label
            >
            <button id="sequence" type="button">동작 전환 연속 확인</button>
            <button id="reattach" type="button">하의 다시 장착</button>
          </fieldset>
          <p id="stats" class="details"></p>
          <p class="details">
            남성 기본 체형 · 교체 파츠<br />제작 중인 샘플 미리보기입니다.
          </p>
        </aside>
      </div>
    </main>
    <script type="module" src="/src/previews/modular-character.ts"></script>
  </body>
</html>
