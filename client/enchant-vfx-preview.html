<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>강화 효과 비교</title>
    <style>
      body {
        margin: 0;
        background: #111714;
        color: #e9dfc6;
        font: 16px system-ui;
      }
      header {
        padding: 24px 5vw;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 26px;
      }
      p {
        color: #a6b3a6;
      }
      button,
      select {
        padding: 10px;
        background: #29392f;
        border: 1px solid #64735c;
        color: #f3e7c6;
        border-radius: 8px;
        font: inherit;
      }
      #view {
        height: 58vh;
      }
      .labels {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        text-align: center;
      }
      h2 {
        font-size: 19px;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>강화 성공 효과 비교</h1>
      <p>
        실제 캐릭터 모델 · 게임 기본 줌 · 검을 높이 든 자세와 칼날에서 퍼지는
        금빛 · 5초
      </p>
      <button id="replay">다시 재생</button>
      <select id="speed">
        <option value="0.25">느리게 · 4배 확대 관찰</option>
        <option value="1" selected>실제 속도 · 5초</option>
      </select>
    </header>
    <div id="view"></div>
    <div class="labels">
      <div>
        <h2>갑옷 · 기본</h2>
      </div>
      <div>
        <h2>갑옷 · 간소화</h2>
      </div>
      <div>
        <h2>그레이트 소드 · 기본</h2>
      </div>
      <div>
        <h2>그레이트 소드 · 간소화</h2>
      </div>
    </div>
    <script type="module">
      import * as THREE from 'three'
      import { WebGPURenderer } from 'three/webgpu'
      import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js'
      import {
        createCharacterModelRoot,
        computeSoleGroundOffset,
        findBoneByName,
      } from './src/lib/utils/characterAnimationUtils.ts'
      import {
        EnchantSuccessEffect,
        ENCHANT_SUCCESS_DURATION,
      } from './src/lib/effects/enchant-success.ts'
      import { PlayerEffectAnchors } from './src/lib/utils/playerEffectAnchors.ts'
      import { poseMainHandProp } from './src/lib/utils/handProps.ts'
      import { getWeaponAnimation } from './src/lib/data/weaponAnimationDefs.ts'
      import { loadWeaponAnimations } from './src/lib/utils/weaponAnimations.ts'
      import { createTwoHandedGrip } from './src/lib/utils/twoHandedGrip.ts'
      import {
        ENCHANT_WEAPON_ANIMATION,
        EnchantWeaponGrip,
        loadEnchantAnimations,
      } from './src/lib/utils/enchantAnimation.ts'
      import {
        applyEnchantLight,
        selectEnchantLight,
      } from './src/lib/utils/enchantLight.ts'
      const host = document.querySelector('#view'),
        renderer = new WebGPURenderer({ antialias: true })
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
      renderer.shadowMap.enabled = true
      host.append(renderer.domElement)
      const scene = new THREE.Scene()
      scene.background = new THREE.Color('#111714')
      const camera = new THREE.OrthographicCamera(-3.6, 3.6, 2, -2, 0.1, 100)
      camera.position.set(0, 28.867, 40.825)
      camera.lookAt(0, 0.9, 0)
      const map = await new THREE.TextureLoader().loadAsync(
        '/textures/vfx/enchant-filament.png'
      )
      map.colorSpace = THREE.SRGBColorSpace
      const variants = [
        { weapon: false, reduced: false },
        { weapon: false, reduced: true },
        { weapon: true, reduced: false },
        { weapon: true, reduced: true },
      ]
      const anchors = variants.map(() => ({
        position: new THREE.Vector3(),
        weapon: null,
      }))
      const boneAnchors = []
      const grips = []
      const enchantActions = []
      const idleActions = []
      const enchantGrips = []
      const enchanting = []
      const models = []
      const pedestals = []
      scene.add(new THREE.HemisphereLight('#e9eedf', '#404c32', 0.35))
      const sun = new THREE.DirectionalLight('#fff2dc', 0.5)
      sun.position.set(-3, 7, 5)
      scene.add(sun)
      const shadowLight = new THREE.PointLight('#ffcc66', 0, 50, 1.2)
      shadowLight.castShadow = true
      shadowLight.shadow.mapSize.set(512, 512)
      shadowLight.shadow.bias = -0.0001
      shadowLight.shadow.normalBias = 0.005
      scene.add(shadowLight)
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(100, 100),
        new THREE.MeshStandardMaterial({ color: '#46513a', roughness: 1 })
      )
      ground.rotation.x = -Math.PI / 2
      ground.position.y = -0.08
      ground.receiveShadow = true
      scene.add(ground)
      const loader = new GLTFLoader()
      const characterPath =
        new URLSearchParams(location.search).get('character') === 'knight'
          ? 'characters/knight.glb'
          : 'characters/valkyrie.glb'
      const character = await loader.loadAsync(`/models/${characterPath}`)
      const locomotion = await loader.loadAsync(
        '/models/animations/locomotion.glb'
      )
      const sword = await loader.loadAsync('/models/weapons/great_sword.glb')
      const weaponProfile = getWeaponAnimation('great_sword')
      const mixers = []
      for (let i = 0; i < variants.length; i++) {
        const { clonedScene, modelRoot } = createCharacterModelRoot(
          character.scene
        )
        clonedScene.position.y = computeSoleGroundOffset(modelRoot)
        scene.add(modelRoot)
        models.push(modelRoot)
        boneAnchors.push(new PlayerEffectAnchors(clonedScene))
        const mixer = new THREE.AnimationMixer(modelRoot)
        let clip = [...character.animations, ...locomotion.animations].find(
          (clip) => /idle/i.test(clip.name)
        )
        if (variants[i].weapon) {
          const clips = await loadWeaponAnimations(
            characterPath,
            clonedScene,
            weaponProfile
          )
          clip = clips.get(weaponProfile.idle)
          const prop = sword.scene.clone()
          poseMainHandProp(prop, 'great_sword')
          findBoneByName(clonedScene, 'RightHand').add(prop)
          anchors[i].weapon = prop
          enchantGrips[i] = new EnchantWeaponGrip(prop)
          grips[i] = createTwoHandedGrip(
            clonedScene,
            prop,
            weaponProfile.offHandGripReach
          )
          const enchants = await loadEnchantAnimations(characterPath, modelRoot)
          enchantActions[i] = mixer.clipAction(
            enchants.get(ENCHANT_WEAPON_ANIMATION)
          )
        }
        if (clip) idleActions[i] = mixer.clipAction(clip).play()
        mixers.push(mixer)
      }
      const effects = anchors.map(() => new EnchantSuccessEffect(map))
      for (let i = 0; i < variants.length; i++) {
        scene.add(effects[i].group)
        effects[i].light.playerId = i
        effects[i].group.visible = true
        const mesh = new THREE.Mesh(
          new THREE.CylinderGeometry(0.65, 0.7, 0.12, 48),
          new THREE.MeshStandardMaterial({ color: '#303c30' })
        )
        mesh.receiveShadow = true
        scene.add(mesh)
        pedestals.push(mesh)
      }
      await renderer.init()
      await renderer.compileAsync(scene, camera)
      effects.forEach((e) => e.clear())
      function resize() {
        const w = host.clientWidth,
          h = host.clientHeight
        renderer.setSize(w, h)
        camera.top = (10 * h) / window.innerHeight
        camera.left = (-camera.top * w) / h
        camera.right = -camera.left
        camera.bottom = -camera.top
        camera.updateProjectionMatrix()
        models.forEach((model, i) => {
          const x =
            camera.left +
            (camera.right - camera.left) * ((i + 0.5) / variants.length)
          model.position.x = x
          pedestals[i].position.x = x
        })
      }
      resize()
      window.addEventListener('resize', resize)
      let elapsed = 0,
        last = performance.now()
      document.querySelector('#replay').onclick = () => {
        elapsed = 0
      }
      document.querySelector('#speed').onchange = () => {
        elapsed = 0
      }
      renderer.setAnimationLoop(() => {
        const now = performance.now()
        elapsed +=
          ((now - last) / 1000) * Number(document.querySelector('#speed').value)
        const dt = (now - last) / 1000
        mixers.forEach((mixer, i) => {
          enchantGrips[i]?.update(0)
          const action = enchantActions[i]
          const active = elapsed < ENCHANT_SUCCESS_DURATION
          if (action && enchanting[i] !== active) {
            const from = active ? idleActions[i] : action
            const to = active ? action : idleActions[i]
            to.reset().play().crossFadeFrom(from, 0.3, false)
            enchanting[i] = active
          }
          mixer.update(dt)
          const weight = action?.getEffectiveWeight() ?? 0
          grips[i]?.update(weight === 0)
          if (weight > 0) enchantGrips[i]?.update(weight)
        })
        scene.updateMatrixWorld(true)
        boneAnchors.forEach((bones, i) => {
          bones.getWorldPosition(
            variants[i].weapon,
            'RightHand',
            anchors[i].position
          )
        })
        last = now
        if (elapsed > ENCHANT_SUCCESS_DURATION + 0.5) elapsed = 0
        for (let i = 0; i < variants.length; i++) {
          if (elapsed < ENCHANT_SUCCESS_DURATION)
            effects[i].update(elapsed, anchors[i], camera, variants[i].reduced)
          else effects[i].clear()
        }
        if (
          !applyEnchantLight(
            shadowLight,
            selectEnchantLight(
              effects.map((effect) => effect.light),
              2,
              models[2].position
            )
          )
        ) {
          shadowLight.position.copy(models[0].position).y = 3
          shadowLight.intensity = 50
        }
        renderer.render(scene, camera)
      })
    </script>
  </body>
</html>
